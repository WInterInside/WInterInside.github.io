<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .petals { transform-origin: 50px 50px; animation: bloom 12s linear infinite; }
    .center { transform-origin: 50px 50px; animation: breathe 3s ease-in-out infinite alternate; }
    @keyframes bloom { to { transform: rotate(360deg); } }
    @keyframes breathe { to { transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) { .petals, .center { animation: none; } }
  </style>
  <g class="petals" fill="#B7AFE4" fill-opacity=".38" stroke="#9FA8DB" stroke-width="1.4">
    <ellipse cx="50" cy="27" rx="8" ry="16"/>
    <ellipse cx="50" cy="27" rx="8" ry="16" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="27" rx="8" ry="16" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="27" rx="8" ry="16" transform="rotate(135 50 50)"/>
    <ellipse cx="50" cy="27" rx="8" ry="16" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="27" rx="8" ry="16" transform="rotate(225 50 50)"/>
    <ellipse cx="50" cy="27" rx="8" ry="16" transform="rotate(270 50 50)"/>
    <ellipse cx="50" cy="27" rx="8" ry="16" transform="rotate(315 50 50)"/>
  </g>
  <circle class="center" cx="50" cy="50" r="9" fill="#80A9D7"/>
</svg>
