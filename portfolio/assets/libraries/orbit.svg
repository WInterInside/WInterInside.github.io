<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .orbit { transform-origin: 50px 50px; animation: turn 7s linear infinite; }
    .inner { transform-origin: 50px 50px; animation: turn 4s linear infinite reverse; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .orbit, .inner { animation: none; } }
  </style>
  <circle cx="50" cy="50" r="30" stroke="#9AB9DE" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="17" stroke="#C5BCE8" stroke-width="1.5"/>
  <g class="orbit"><circle cx="50" cy="20" r="5" fill="#80A9D7"/></g>
  <g class="inner"><circle cx="50" cy="33" r="3" fill="#B8A7E4"/></g>
  <circle cx="50" cy="50" r="3" fill="#80A9D7"/>
</svg>
